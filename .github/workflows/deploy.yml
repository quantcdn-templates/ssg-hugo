name: "Deploy to QuantCDN"

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    runs-on: ubuntu-latest
    env:
      # Template repositories have no Quant credentials; they only verify the build.
      DEPLOY_CONFIGURED: ${{ vars.QUANT_CUSTOMER != '' && vars.QUANT_PROJECT != '' && secrets.QUANT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Cache local revision file
        id: cache-quant-revisions
        uses: actions/cache@v4
        with:
          path: .quant-revision
          key: quant-revision

      - name: Build static output
        run: hugo --minify

      - name: Deployment setup
        if: env.DEPLOY_CONFIGURED != 'true'
        run: echo 'Build verified. Deployment requires QUANT_CUSTOMER and QUANT_PROJECT variables and a QUANT_TOKEN secret.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy updates to QuantCDN
        if: env.DEPLOY_CONFIGURED == 'true'
        uses: quantcdn/deploy-action@9bf8cae8497ab6628d4b248db9eb11464f37e1e5 # v7.0.1
        with:
          customer: ${{ vars.QUANT_CUSTOMER }}
          project: ${{ vars.QUANT_PROJECT }}
          token: ${{ secrets.QUANT_TOKEN }}
          endpoint: ${{ vars.QUANT_ENDPOINT || 'https://api.quantcdn.io/v1' }}
          dir: public
          chunk-size: 20
          skip-purge: true

      - name: Purge the QuantCDN cache
        if: env.DEPLOY_CONFIGURED == 'true'
        uses: quantcdn/purge-action@v6
        with:
          customer: ${{ vars.QUANT_CUSTOMER }}
          project: ${{ vars.QUANT_PROJECT }}
          token: ${{ secrets.QUANT_TOKEN }}
          endpoint: ${{ vars.QUANT_ENDPOINT || 'https://api.quantcdn.io/v1' }}
          url_pattern: "/*"
