# CI workflow for Hugo SSG template
# Validates that the template builds successfully with latest Hugo
#
# Scheduled daily to catch issues early.
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Run daily at midnight UTC to catch issues early
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Verify build output
        run: |
          if [ -d "public" ]; then
            echo "✓ Build output directory exists"
            ls -la public/
          else
            echo "✗ Build output directory 'public' not found"
            exit 1
          fi
